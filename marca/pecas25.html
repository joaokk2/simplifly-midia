<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
body{background:#999}
section{position:relative;overflow:hidden;color:var(--ink);margin:0 0 20px}
.s{width:1080px;height:1350px}.st{width:1080px;height:1920px}
.tealb{background:radial-gradient(120% 85% at 80% 0%,#2CC2B1 0%,#00A393 35%,#00796F 80%,#006B62 100%);color:#fff}
.coral{background:linear-gradient(160deg,#FF9A66 0%,#FF783B 45%,#E0632A 100%);color:#fff}
.sun{background:linear-gradient(165deg,#FFD66B 0%,#FFB443 45%,#FF8A3D 100%)}
.cream{background:var(--bg)}.mint{background:linear-gradient(170deg,#E6F7F3,#CBEFE7)}.sand{background:linear-gradient(170deg,#FBF3E4,#F3E3C6)}
.lilac{background:linear-gradient(170deg,#F1EDFF,#E2DAFF)}.sky{background:linear-gradient(170deg,#E3F1FF,#C9E3FF)}
.coral .mark:before,.tealb .mark:before{background:var(--c)}
.coral .mark:before{background:#B8441A}
.H{font-family:'Inter Display';font-weight:900;letter-spacing:-.045em;line-height:.95}
.num{font-family:'Inter Display';font-weight:900;font-size:200px;letter-spacing:-.06em;line-height:.8;color:var(--c);opacity:.9}
.kick{color:var(--t)}.tealb .kick,.coral .kick{color:#fff}
.tealb .kick i{background:#FFB08A}.coral .kick i{background:#fff}
.sub{font-size:40px;font-weight:600;line-height:1.3;color:var(--mut)}
.tealb .sub,.coral .sub{color:rgba(255,255,255,.88)}
.bub{position:relative;max-width:760px;padding:24px 30px 16px;border-radius:30px;font-size:38px;line-height:1.25;background:#fff;box-shadow:0 18px 40px rgba(14,42,39,.12);margin-bottom:22px}
.bub .tm{display:block;text-align:right;font-size:24px;color:#8a978f;margin-top:4px}
.bub.o{background:#D9FDD3;margin-left:auto}.bub.l{background:#FFE3D6}
.card{background:#fff;border-radius:34px;padding:30px 36px;box-shadow:0 18px 50px rgba(14,42,39,.1);display:flex;gap:26px;align-items:center;margin-bottom:24px}
.card .ic{width:84px;height:84px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:38px;flex:none}
.card b{display:block;font-size:38px;letter-spacing:-.01em}.card span{font-size:28px;color:var(--mut)}
.chk{width:110px;height:110px;border-radius:32px;background:var(--t);display:flex;align-items:center;justify-content:center;margin-bottom:50px}
.coral .chk{background:#fff}
.ring{position:absolute;border-radius:50%;border:6px solid rgba(0,121,111,.12)}
.tealb .ring,.coral .ring{border-color:rgba(255,255,255,.16)}
.stripes:after{content:"";position:absolute;inset:-300px;background:repeating-linear-gradient(-35deg,rgba(255,120,59,.09) 0 40px,transparent 40px 120px);pointer-events:none;z-index:0}
.coral.stripes:after{background:repeating-linear-gradient(-35deg,rgba(255,255,255,.08) 0 40px,transparent 40px 120px)}
.dots:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,121,111,.15) 5px,transparent 6px);background-size:60px 60px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 50%);pointer-events:none}
.z{z-index:1}
.url{display:inline-flex;align-items:center;gap:16px;background:#fff;color:var(--ink);font-weight:800;font-size:44px;padding:26px 38px;border-radius:26px;box-shadow:0 24px 50px rgba(0,0,0,.18)}
.url i{width:20px;height:20px;border-radius:50%;background:var(--c)}
.opt{background:#fff;border-radius:28px;padding:34px 40px;font-size:46px;font-weight:800;display:flex;justify-content:space-between;margin-bottom:26px;box-shadow:0 14px 34px rgba(14,42,39,.12);color:var(--ink)}
.opt em{font-style:normal;color:var(--mut);font-weight:600}
/* capa */
.safe{position:absolute;left:0;right:0;top:285px;height:1350px;display:flex;flex-direction:column;justify-content:center;padding:0 90px}
.tag{display:inline-flex;align-self:flex-start;align-items:center;gap:14px;font-weight:800;font-size:30px;letter-spacing:.12em;text-transform:uppercase;padding:14px 24px;border-radius:99px;background:rgba(255,255,255,.2);color:#fff;margin-bottom:44px}
.tag i{width:14px;height:14px;border-radius:50%;background:#fff}
.lt .tag{background:rgba(0,121,111,.12);color:var(--t)}.lt .tag i{background:var(--c)}
.big{font-family:'Inter Display';font-weight:900;letter-spacing:-.05em;line-height:.92;color:#fff}
.lt .big{color:var(--ink)}
.play{position:absolute;right:90px;bottom:360px;width:120px;height:120px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px rgba(255,120,59,.4)}
.coral .play{background:#fff}
.lg{position:absolute;left:90px;bottom:375px;height:70px}
</style></head><body>
<style>
.peach{background:linear-gradient(170deg,#FFF1E8,#FFD6C0)}.aqua{background:linear-gradient(170deg,#E2F8F4,#A8E5DB)}
.grid:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(0,121,111,.09) 3px,transparent 3px),linear-gradient(90deg,rgba(0,121,111,.09) 3px,transparent 3px);background-size:90px 90px;pointer-events:none;-webkit-mask-image:radial-gradient(90% 70% at 50% 40%,#000,transparent)}
.coral.grid:after,.tealb.grid:after{background-image:linear-gradient(rgba(255,255,255,.12) 3px,transparent 3px),linear-gradient(90deg,rgba(255,255,255,.12) 3px,transparent 3px)}
.blob{position:absolute;border-radius:50%;pointer-events:none}
.hr{font-family:'Inter Display';font-weight:900;font-size:230px;letter-spacing:-.06em;line-height:.8;color:var(--c)}
.chipx{display:inline-flex;align-items:center;gap:14px;background:#fff;border-radius:99px;padding:18px 30px;font-size:34px;font-weight:800;box-shadow:0 14px 34px rgba(14,42,39,.12)}
</style>
<script>
const LW='logo-white.svg',LD='logo-dark.svg';
const dark=c=>/tealb|coral/.test(c);
const brand=(c,i,n)=>`<div class="brand z"><img src="${dark(c)?LW:LD}"></div>`+(n?`<div class="pager z">${Array.from({length:n},(_,k)=>`<b class="${k==i?'on':''}"></b>`).join('')}</div>`:'');
const rings=`<div class="ring" style="width:900px;height:900px;right:-380px;top:-330px"></div><div class="ring" style="width:1300px;height:1300px;right:-580px;top:-530px"></div>`;
const blobs=(a='rgba(255,120,59,.16)',b='rgba(0,163,147,.16)')=>`<div class="blob" style="width:760px;height:760px;background:${a};right:-260px;top:-200px"></div><div class="blob" style="width:620px;height:620px;background:${b};left:-300px;bottom:60px"></div>`;
const S=[];
function add(id,cls,html,i,n){S.push(id);document.body.insertAdjacentHTML('beforeend',`<section id="${id}" class="s ${cls}">${html}${brand(cls,i,n)}</section>`)}
function addSt(id,cls,html){S.push(id);document.body.insertAdjacentHTML('beforeend',`<section id="${id}" class="st ${cls}">${html}<img class="z" src="${dark(cls)?LW:LD}" style="position:absolute;left:90px;bottom:250px;height:62px"></section>`)}
const PLAY='<svg width="54" height="54" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';
const PLAYC='<svg width="54" height="54" viewBox="0 0 24 24" fill="#FF783B"><path d="M8 5v14l11-7z"/></svg>';
function capa(id,cls,deco,tag,html,fs){const lt=!dark(cls);S.push(id);document.body.insertAdjacentHTML('beforeend',`<section id="${id}" class="st ${cls} ${deco=='blobs'?'':deco} ${lt?'lt':''}">${deco=='rings'?rings:''}${deco=='blobs'?blobs(lt?undefined:'rgba(255,255,255,.14)',lt?undefined:'rgba(255,255,255,.10)'):''}<div class="safe z"><div class="tag"><i></i>${tag}</div><div class="big" style="font-size:${fs}px">${html}</div></div><img class="lg z" src="${lt?LD:LW}"><div class="play z">${cls.includes('coral')?PLAYC:PLAY}</div></section>`)}
const CMT=(c='#DFF5F1')=>`<div style="font-size:34px;font-weight:600;color:${c}">Comenta <b style="background:rgba(255,255,255,.18);padding:2px 12px;border-radius:10px;color:#fff">SIMPLIFLY</b> que eu te mando como funciona.</div>`;
const IGG='linear-gradient(135deg,#FEDA75,#FA7E1E 30%,#D62976 60%,#962FBF 85%,#4F5BD5)';

/* ===== CARROSSEL D: Black Friday hora a hora ===== */
const ND=7;
add('d1','coral grid',`<div class="pad z" style="top:150px"><div class="kick"><i></i>Black Friday no WhatsApp</div></div>
<div class="pad H z" style="top:270px;font-size:138px">O que acontece<br>no seu WhatsApp<br><span style="color:#FFF1C9">na sexta.</span></div>
<div class="pad sub z" style="top:1000px">Hora a hora. Arrasta →</div>`,0,ND);
add('d2','peach',`${blobs()}<div class="pad z" style="top:120px"><div class="hr">00h</div><div class="H" style="font-size:92px;margin-top:40px">A promoção<br><span class="co">vai ao ar.</span></div></div>
<div class="pad z" style="top:720px"><div class="bub">Já começou? 👀<span class="tm">00:02</span></div><div class="bub">O desconto vale pra tudo?<span class="tm">00:03</span></div><div class="bub">Aceita Pix?<span class="tm">00:05</span></div></div>`,1,ND);
add('d3','sky grid',`<div class="pad z" style="top:120px"><div class="hr">10h</div><div class="H" style="font-size:92px;margin-top:40px">Chega a<br><span class="co">primeira leva.</span></div></div>
<div class="pad z" style="top:720px"><div class="card"><div class="ic wa">W</div><div><b>WhatsApp 1</b><span>"Ainda tem?"</span></div></div><div class="card"><div class="ic" style="background:#2F9E8F">W</div><div><b>WhatsApp 2</b><span>"Qual o prazo?"</span></div></div><div class="card"><div class="ic" style="background:${IGG}">IG</div><div><b>Direct</b><span>"Manda o link?"</span></div></div></div>`,2,ND);
add('d4','sand',`<div class="pad z" style="top:120px"><div class="hr">13h</div><div class="H" style="font-size:92px;margin-top:40px">Metade da equipe<br><span class="co">no almoço.</span></div></div>
<div class="pad z" style="top:760px"><div class="H" style="font-size:70px;color:var(--mut)">E a fila só cresce.</div><div style="margin-top:50px;display:flex;gap:18px;flex-wrap:wrap"><span class="chipx">⏳ Esperando</span><span class="chipx">⏳ Esperando</span><span class="chipx">⏳ Esperando</span><span class="chipx">⏳ Esperando</span></div></div>`,3,ND);
add('d5','lilac dots',`<div class="pad z" style="top:120px"><div class="hr">18h</div><div class="H" style="font-size:92px;margin-top:40px">A mesma pergunta,<br><span class="co">o dia inteiro.</span></div></div>
<div class="pad z" style="top:720px"><div class="bub">Qual o prazo de entrega?<span class="tm">17:52</span></div><div class="bub">Qual o prazo de entrega?<span class="tm">18:03</span></div><div class="bub">Qual o prazo de entrega?<span class="tm">18:11</span></div></div>`,4,ND);
add('d6','aqua',`<div class="pad z" style="top:120px"><div class="hr">23h59</div><div class="H" style="font-size:92px;margin-top:40px">A mensagem<br><span class="co">que ninguém viu.</span></div></div>
<div class="pad z" style="top:740px"><div class="bub">Ainda dá tempo de comprar com desconto?<span class="tm">23:58</span></div><div class="bub l" style="max-width:420px">…<span class="tm">sem resposta</span></div></div>`,5,ND);
add('d7','tealb',`${rings}<div class="pad z" style="top:150px"><div class="kick"><i></i>Com o Simplifly</div></div>
<div class="pad H z" style="top:250px;font-size:104px">Na sexta,<br>ninguém fica<br><span class="mark">sem resposta.</span></div>
<div class="pad z" style="top:690px;font-size:40px;font-weight:700;line-height:1.6">✓ IA responde as perguntas repetidas<br>✓ Todos os números + Direct numa tela<br>✓ Equipe dividindo a fila</div>
<div class="pad z" style="top:940px"><div class="url"><i></i>simpliflyone.com</div></div>
<div class="pad z" style="top:1085px">${CMT()}</div>`,6,ND);

/* ===== CARROSSEL E: cliente que sumiu tem data pra voltar ===== */
const NE=7;
add('e1','aqua',`${blobs()}<div class="pad z" style="top:150px"><div class="kick" style="color:var(--t)"><i></i>Retorno de cliente</div></div>
<div class="pad H z" style="top:270px;font-size:136px">Cliente que<br>sumiu tem<br><span class="mark">data pra voltar.</span></div>
<div class="pad sub z" style="top:1000px">5 negócios, 5 momentos certos →</div>`,0,NE);
const E=[['peach','Salão e barbearia','30 dias depois<br>do último corte.','Oi, Pedro! Já faz um mês do seu corte 💈 Sexta às 18h fica bom?'],
['mint','Clínica odontológica','6 meses depois<br>da limpeza.','Oi, Carla! Tá na época da sua limpeza 🦷 Temos horário quinta de manhã.'],
['sky','Pet shop','Duas semanas<br>depois do banho.','Oi! O Thor já tá precisando de banho? 🐶 Sábado às 9h tem vaga.'],
['sand','Oficina mecânica','Na época<br>da revisão.','Oi, Marcos! Já tá na época da revisão do seu carro 🔧 Quer agendar?'],
['lilac','Escola e curso','Antes da<br>rematrícula.','Oi, Júlia! As turmas de 2027 já abriram 📚 Quer garantir sua vaga?']];
E.forEach(([c,k,h,m],i)=>add('e'+(i+2),c+(i%2?' dots':' grid'),`<div class="pad z" style="top:130px"><div class="num">0${i+1}</div><div class="kick" style="margin-top:30px;color:var(--t)"><i></i>${k}</div><div class="H" style="font-size:100px;margin-top:24px">${h}</div></div>
<div class="pad z" style="top:800px"><div class="bub o" style="margin-left:0;max-width:880px">${m}<span class="tm">mensagem de retorno</span></div></div>`,i+1,NE));
add('e7','tealb',`${rings}<div class="pad z" style="top:150px"><div class="kick"><i></i>Com o Simplifly</div></div>
<div class="pad H z" style="top:250px;font-size:100px">Cada cliente<br>no CRM.<br><span class="mark">Retorno na<br>hora certa.</span></div>
<div class="pad z" style="top:760px;font-size:40px;font-weight:700;line-height:1.6">✓ Etapa de cada cliente<br>✓ Disparos de retorno<br>✓ WhatsApp e Instagram juntos</div>
<div class="pad z" style="top:1000px"><div class="url"><i></i>simpliflyone.com</div></div>
<div class="pad z" style="top:1140px">${CMT()}</div>`,6,NE);

/* ===== ESTÁTICO ===== */
add('f1','peach grid',`<div class="pad z" style="top:150px"><div class="kick" style="color:var(--t)"><i></i>Recado pra quem faz orçamento</div></div>
<div class="pad H z" style="top:270px;font-size:122px">Orçamento que<br>chega amanhã<br>já chega <span class="co">atrasado.</span></div>
<div class="pad z" style="top:720px"><div class="bub">Consegue me mandar o valor hoje?<span class="tm">09:10</span></div><div class="bub l">Já fechei com outro, obrigado!<span class="tm">16:45</span></div></div>
<div class="pad H z" style="top:1105px;font-size:48px;color:var(--t)">Oficina, reforma, clínica, evento: vale pra todo mundo.</div>`,0,0);

/* ===== STORIES ===== */
addSt('s1','coral grid',`<div class="pad z" style="top:330px"><div class="kick"><i></i>Sexta é Black Friday</div></div>
<div class="pad H z" style="top:420px;font-size:124px">Na sexta,<br>seu WhatsApp<br>vai…</div>
<div class="pad z" style="top:900px"><div class="opt">Dar conta <em>💪</em></div><div class="opt">Virar caos <em>🤯</em></div><div class="opt">Nem sei <em>😅</em></div></div>
<div class="pad z" style="top:1370px;font-size:40px;font-weight:700">Responde no Direct 👇</div>`);
addSt('s2','sky',`${blobs()}<div class="pad z" style="top:330px"><div class="kick" style="color:var(--t)"><i></i>Me conta</div></div>
<div class="pad H z" style="top:420px;font-size:112px">Quanto tempo<br>seu cliente espera<br>uma resposta?</div>
<div class="pad z" style="top:900px"><div class="opt">Minutos <em>⚡</em></div><div class="opt">Algumas horas <em>⏳</em></div><div class="opt">Só no outro dia <em>😬</em></div></div>
<div class="pad z" style="top:1370px;font-size:40px;font-weight:700;color:var(--ink)">Responde no Direct 👇</div>`);
addSt('s3','tealb',`${rings}<div class="pad z" style="top:330px"><div class="kick"><i></i>O Natal tá chegando</div></div>
<div class="pad H z" style="top:420px;font-size:108px">Encomenda,<br>presente, horário…<br>tudo pelo<br><span class="mark">WhatsApp.</span></div>
<div class="pad z" style="top:1000px;font-size:46px;font-weight:700;line-height:1.35">Quem responde às 23h?<br><span style="color:#FFE3D6">A IA do Simplifly.</span></div>
<div class="pad z" style="top:1190px"><div class="url"><i></i>simpliflyone.com</div></div>
<div class="pad z" style="top:1340px;font-size:40px;font-weight:700">Manda <b style="background:rgba(255,255,255,.22);padding:2px 14px;border-radius:12px">SIMPLIFLY</b> no Direct 👇</div>`);
addSt('s4','aqua',`<div class="pad z" style="top:300px"><div class="kick" style="color:var(--t)"><i></i>Funciona assim</div></div>
<div class="pad H z" style="top:390px;font-size:92px">A IA responde<br>no WhatsApp,<br>no Direct<br><span class="co">e nos comentários.</span></div>
<div class="pad z" style="top:800px"><div class="card"><div class="ic wa">W</div><div><b>WhatsApp · "Tem horário amanhã?"</b><span>IA: Tem sim! 10h ou 15h?</span></div></div><div class="card"><div class="ic" style="background:${IGG}">IG</div><div><b>Direct · "Quanto custa?"</b><span>IA: Te mando os valores agora 😉</span></div></div><div class="card"><div class="ic" style="background:#E2B23A">💬</div><div><b>Comentário · "Quero!"</b><span>IA: Te chamei no Direct!</span></div></div></div>
<div class="pad H z" style="top:1420px;font-size:52px;color:var(--t)">E a equipe numa tela só.</div>`);

/* ===== CAPAS ===== */
capa('capa_bf25','coral','grid','Ouça com som 🔊','Sexta é<br>Black Friday.<br><span style="color:#FFF1C9">Seu WhatsApp<br>vai lotar.</span>',132);
capa('capa_estetica','peach','blobs','Ouça com som 🔊','Perguntou<br>no Direct<br>às 22h.<br><span class="co">Marcou em<br>outra clínica.</span>',122);
capa('capa_vet','aqua','grid','Veterinária e pet','Chamou<br>3 clínicas.<br><span class="co">Ficou com a<br>que respondeu.</span>',126);
capa('capa_visita','sky','blobs','Imobiliária','Visita<br>marcada.<br><span class="co">Ninguém<br>confirmou.</span>',150);
capa('capa_salao','peach','dots','Salão e barbearia','Cliente fiel.<br>Sumiu há<br><span class="co">3 meses.</span>',150);
capa('capa_panetone','cream','blobs','Confeitaria','Pediu<br>panetone<br>pelo Direct.<br><span class="co">Ninguém viu.</span>',140);
capa('capa_material','sand','grid','Loja de materiais','Mandou<br>a lista.<br><span class="co">Ninguém<br>orçou.</span>',156);
window.SECTIONS=S;
</script>
</body></html>
