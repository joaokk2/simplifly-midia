 if(G.mid=='bubbles'){G.items.forEach((m,i)=>{const n=$(`<div class="m ${m[2]?'mo':'mi'}" style="position:absolute;${m[2]?'right:100px':'left:100px'};top:${G.midTop+i*175}px;max-width:820px;font-size:42px;padding:24px 32px 16px;border-radius:30px;box-shadow:0 18px 40px rgba(0,30,26,.18);${m[3]?'background:#FFE3D6':''}">${m[0]}<span class="tm" style="font-size:26px">${m[1]}</span></div>`);A.appendChild(n);mids.push(n)})}
 const tag=G.tag?$(`<div class="T${ink}" style="top:${G.tagTop}px;font-size:${G.tagS||80}px">${G.tag}</div>`):null;if(tag)A.appendChild(tag);

 const CT=cta();R.appendChild(CT);R.appendChild(FL);
 const t1=G.tB||5.6,tc0=G.tC||9.2;
 S.render=t=>{show(A,t<t1+.4);show(B,t>=t1&&t<tc0+.4);show(CT,t>=tc0);
  lines.forEach((e,i)=>slam(e,t,i*.5,1.6));

   if(G.mid=='phone'){n.style.transform=`translateY(${(1-p)*1000}px) rotate(${-4+shake(t,G.shakeT||3.8,10)*.4}deg)`}else n.style.transform=`translateX(${(1-p)*(i%2?1:-1)*900}px) rotate(${i%2?1.5:-1.5}deg)`});

  slam(bT,t,t1+.4,1.4);const pa=k(t,t1+.6,t1+1.2,out);app.style.opacity=pa;app.style.transform=`translateY(${(1-pa)*120}px)`;
  [['.r1',t1+1.4],['.r2',t1+1.9],['.r3',t1+2.5]].forEach(([s,t0])=>{const e=app.querySelector(s);const q=k(t,t0,t0+.3,out);e.style.opacity=q;e.style.transform=`translateY(${(1-q)*20}px)`});
  const tc=k(t,tc0,tc0+.4,expo);CT.style.transform=`translateY(${(1-tc)*1920}px)`;ctaRender(CT,t,tc0+.2);flash(FL,t,t1);
  R.style.transform=`translate(${shake(t,G.shakeT||3.8,12)}px,0)`};

if(V=='n'){ // narrado configurável

 if(G.ctaBg)window.CTA_BG=G.ctaBg;
 const A=$(`<div class="L" style="${XBG[G.bgA]||BGS[G.bgA]}"></div>`);if(G.deco)A.appendChild(deco(G.deco,!LIGHT.includes(G.bgA)));R.appendChild(A);
 const dk=!LIGHT.includes(G.bgA)&&G.bgA!='sun';
 const clock=$(`<div class="clock" style="top:180px;font-size:150px;color:${dk?'#fff':'var(--ink)'}"></div>`);A.appendChild(clock);
 const sub=$(`<div class="clock" style="top:350px;font-size:38px;font-weight:700;letter-spacing:0;color:${dk?'#FFE3D6':'var(--mut)'}"></div>`);A.appendChild(sub);
 const ph=$(`<div class="phone" style="left:230px;top:450px;width:620px;height:1180px"><div class="scr"><div class="isl"></div><div class="sb"><span class="sbt"></span><span>5G</span></div><div class="wah"><div class="av" style="width:70px;height:70px;background:${G.avc};font-size:28px">${G.who[0]}</div><div><div class="nm">${G.who}</div><div class="st">${G.whoSub}</div></div></div><div class="chat" style="gap:22px"></div></div></div>`);A.appendChild(ph);
 const chat=ph.querySelector('.chat');
 if(G.ig){ph.querySelector('.wah .av').style.background='linear-gradient(135deg,#FEDA75,#FA7E1E 30%,#D62976 60%,#962FBF 85%,#4F5BD5)'}
 const msgs=G.msgs.map(m=>{const e=$(`<div class="m ${m.out?'mo':'mi'}" style="font-size:${G.mfs||33}px;${m.lost?'background:#FFE3D6':''}${G.ig&&m.out?';background:#7B5CFA;color:#fff':''}">${m.n?`<b style="display:block;font-size:${(G.mfs||33)-6}px;color:${m.c||'#00796F'}">${m.n}</b>`:''}${m.t}<span class="tm">${m.h}</span></div>`);chat.appendChild(e);return [e,m]});
 const stamp=$(`<div class="sticker" style="left:130px;top:1400px;font-size:54px;padding:24px 40px;background:var(--td)">${G.stamp}</div>`);A.appendChild(stamp);
 const B=$(`<div class="L" style="${XBG[G.bgB]||BGS.teal}"></div>`);B.appendChild(deco(G.decoB||'glow',true));R.appendChild(B);
 B.appendChild($('<div class="kk" style="top:250px"><i></i>Com o Simplifly</div>'));
 const bT=$(`<div class="T" style="top:320px;font-size:${G.revS||112}px">${G.reveal}</div>`);B.appendChild(bT);
 const app=appMock();app.style.top='640px';B.appendChild(app);
 fillApp(app,G);
 const chips=$(`<div style="position:absolute;left:80px;right:80px;top:1500px;display:flex;gap:16px;flex-wrap:wrap">${G.chips.map(c=>`<span class="pill" style="font-size:32px;padding:18px 28px;background:#fff">${c}</span>`).join('')}</div>`);B.appendChild(chips);
 const CT=cta();R.appendChild(CT);
 const cap=$('<div style="position:absolute;left:60px;right:60px;top:1700px;text-align:center;font-weight:800;font-size:50px;line-height:1.15;color:#fff"><span class="ct" style="background:rgba(14,42,39,.86);padding:14px 26px;border-radius:22px;-webkit-box-decoration-break:clone;box-decoration-break:clone"></span></div>');R.appendChild(cap);R.appendChild(FL);
 const Q=G.q;
 S.render=t=>{show(A,t<Q.rev+.6);show(B,t>=Q.rev&&t<Q.cta+.4);show(CT,t>=Q.cta);
  const ck=G.clocks.filter(c=>t>=c[0]).pop();clock.textContent=ck[1];sub.textContent=ck[2]||'';ph.querySelector('.sbt').textContent=ck[1];
  const lastC=G.clocks.filter(c=>t>=c[0]).pop()[0];clock.style.transform=`scale(${mix(1.35,1,k(t,lastC,lastC+.3,expo))})`;clock.style.opacity=t<.05?0:1;
  const pp=k(t,.1,.6,back);ph.style.transform=`translateY(${(1-pp)*1400}px) rotate(${-3+shake(t,Q.lost,8)*.2}deg)`;
  msgs.forEach(([e,m])=>{const q=k(t,m.at,m.at+.3,back);e.style.opacity=k(t,m.at,m.at+.12);e.style.transform=`scale(${mix(.7,1,q)})`;e.style.transformOrigin=m.out?'100% 0':'0 0'});
  const ps=k(t,Q.stamp,Q.stamp+.3,back);stamp.style.opacity=k(t,Q.stamp,Q.stamp+.1);stamp.style.transform=`rotate(-6deg) scale(${mix(1.8,1,ps)})`;
  const tb=k(t,Q.rev,Q.rev+.5,expo);TR(A,B,tb,G.trans);
  slam(bT,t,Q.rev+.3,1.4);const pa=k(t,Q.rev+.5,Q.rev+1.1,out);app.style.opacity=pa;app.style.transform=`translateY(${(1-pa)*140}px)`;
  [['.r1',Q.ai],['.r2',Q.ai+.6],['.r3',Q.ai2]].forEach(([s,t0])=>{const e=app.querySelector(s);const qq=k(t,t0,t0+.3,out);e.style.opacity=qq;e.style.transform=`translateY(${(1-qq)*20}px)`});
  const pc=k(t,Q.chips,Q.chips+.35,back);chips.style.opacity=k(t,Q.chips,Q.chips+.1);chips.style.transform=`scale(${pc})`;chips.style.transformOrigin='0 50%';
  const tc=k(t,Q.cta,Q.cta+.4,expo);CT.style.transform=`translateY(${(1-tc)*1920}px)`;ctaRender(CT,t,Q.cta+.1);flash(FL,t,Q.rev);
  const c=G.cap.find(x=>t>=x[0]&&t<x[1]);cap.querySelector('.ct').textContent=c?c[2]:'';cap.style.opacity=c?1:0;
